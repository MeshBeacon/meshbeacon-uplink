name: Build clusterduckd

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cross-compiled inside a Debian (bookworm) container so that the
      # toolchain and dev libraries come from the Debian archive rather
      # than Ubuntu. arm64 is a full Debian release architecture, so no
      # extra "ports" repo is needed - just enable the foreign arch.
      - name: Build clusterduckd for arm64 (Debian cross-compile)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:bookworm \
            bash -c "
              set -euo pipefail
              dpkg --add-architecture arm64
              apt-get update
              apt-get install -y --no-install-recommends \
                crossbuild-essential-arm64 \
                libusb-1.0-0-dev:arm64 \
                libpaho-mqtt-dev:arm64 \
                libprotobuf-dev:arm64
              make clusterduck ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
            "

      - name: Fix file ownership
        run: sudo chown -R "$(id -u)":"$(id -g)" .

      - name: Verify binary architecture
        run: file clusterduck/clusterduckd

      - name: Package artifact
        run: |
          VERSION="${{ github.ref_name }}"
          ARTIFACT="clusterduckd-${VERSION}-linux-arm64"
          mkdir -p dist
          cp clusterduck/clusterduckd "dist/${ARTIFACT}"
          echo "ARTIFACT_PATH=dist/${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clusterduckd-linux-arm64
          path: ${{ env.ARTIFACT_PATH }}

  build-mips-24kec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The MT7628AN (and other mt76x8-family 24KEc SoCs) used by real
      # OpenWrt ramips/mt76x8 hardware have no hardware FPU, and this
      # target's kernel has no FPU emulator either (confirmed: no
      # FPU-emulation option enabled in the real device's kernel config) -
      # so the binary must contain *zero* hardware floating point (COP1)
      # instructions, or it SIGILLs on real hardware. Debian's
      # crossbuild-essential-mipsel is hard-float-only - it ships no
      # soft-float glibc variant at all (no gnu/stubs-o32_soft.h anywhere in
      # the package, confirmed by direct inspection) - so no combination of
      # compiler flags on that toolchain can ever produce a working binary
      # for this target.
      #
      # Instead, this job downloads OpenWrt's own official SDK toolchain for
      # ramips/mt76x8 (musl libc; -msoft-float and -mno-dsp are both its
      # compiled-in defaults, exactly matching the real device's kernel/ABI,
      # confirmed via `-Q --help=target`) and cross-builds clusterduckd's
      # two real link dependencies (paho-mqtt-c, protobuf) from source
      # against it, since no prebuilt musl/soft-float packages for them
      # exist anywhere. No container is needed since the toolchain is a
      # self-contained set of static-ish binaries that run directly on the
      # runner. (libusb-1.0 is intentionally not built here - it's never
      # actually called by this codebase; device I/O goes through a plain
      # tty, not libusb.)
      # The toolchain's gcc/g++ are not real ELF binaries but wrapper
      # scripts that `exec` the real compiler via an explicit, relative
      # dynamic loader path (`../../host/lib/ld-linux-x86-64.so.2`, plus an
      # `LD_PRELOAD=.../host/lib/runas.so`) - OpenWrt bundles its own
      # host-side loader/libs rather than relying on the runner's glibc. So
      # `staging_dir/host/` must be extracted alongside
      # `staging_dir/toolchain-.../`, or the wrapper fails with "No such
      # file or directory" trying to exec a loader that was never unpacked.
      - name: Download OpenWrt SDK toolchain for ramips/mt76x8
        run: |
          mkdir -p /tmp/openwrt-sdk
          curl -sL https://downloads.openwrt.org/releases/21.02.3/targets/ramips/mt76x8/openwrt-sdk-21.02.3-ramips-mt76x8_gcc-8.4.0_musl.Linux-x86_64.tar.xz \
            | tar -xJ -C /tmp/openwrt-sdk --wildcards \
              '*/staging_dir/toolchain-mipsel_24kc_gcc-8.4.0_musl/*' \
              '*/staging_dir/host/*'
          TOOLCHAIN_BIN="$(find /tmp/openwrt-sdk -maxdepth 4 -type d -path '*/toolchain-mipsel_24kc_gcc-8.4.0_musl/bin')"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
          echo "SYSROOT=/tmp/duck-sysroot" >> "$GITHUB_ENV"

      # musl libc in this toolchain predates musl 1.2.0 and lacks the GNU
      # qsort_r(3) extension that libloragw's packet-sort code and
      # clusterduck's jitqueue.c both rely on - this is patched directly in
      # the vendored sources (loragw_hal.c / jitqueue.c) with a portable
      # fallback shim guarded by `#if !defined(__GLIBC__)`, so it's a no-op
      # on the glibc-based arm64/mips24kc jobs.
      - name: Cross-build paho-mqtt-c (musl, soft-float, no SSL)
        run: |
          mkdir -p "$SYSROOT"
          git clone --depth 1 --branch v1.3.13 \
            https://github.com/eclipse/paho.mqtt.c.git /tmp/paho.mqtt.c
          cmake -S /tmp/paho.mqtt.c -B /tmp/paho-build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mips \
            -DCMAKE_C_COMPILER=mipsel-openwrt-linux-gcc \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr" \
            -DPAHO_WITH_SSL=FALSE \
            -DPAHO_BUILD_STATIC=TRUE \
            -DPAHO_BUILD_SHARED=FALSE \
            -DPAHO_BUILD_SAMPLES=FALSE \
            -DPAHO_ENABLE_TESTING=FALSE \
            -DPAHO_ENABLE_CPACK=FALSE
          cmake --build /tmp/paho-build --target install -- -j"$(nproc)"

      - name: Cross-build protobuf runtime (musl, soft-float)
        run: |
          git clone --depth 1 --branch v21.12 \
            https://github.com/protocolbuffers/protobuf.git /tmp/protobuf
          cmake -S /tmp/protobuf -B /tmp/protobuf-build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mips \
            -DCMAKE_CXX_COMPILER=mipsel-openwrt-linux-g++ \
            -DCMAKE_INSTALL_PREFIX="$SYSROOT/usr" \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_PROTOC_BINARIES=OFF \
            -Dprotobuf_BUILD_LIBPROTOC=OFF \
            -Dprotobuf_BUILD_SHARED_LIBS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF
          cmake --build /tmp/protobuf-build --target install -- -j"$(nproc)"

      # -lgcc_eh/-lgcc must be added explicitly: this toolchain's g++ spec
      # does not auto-append them when LIBS is overridden on a -static link,
      # which otherwise fails with dozens of undefined `_Unwind_*` reference
      # errors from the statically-linked libstdc++. They're wrapped in
      # --start-group/--end-group alongside the rest of LIBS so the linker
      # re-scans archives until all circular references resolve.
      - name: Build clusterduckd for MIPS24KEc (OpenWrt musl toolchain)
        run: |
          make clusterduck ARCH=mips CROSS_COMPILE=mipsel-openwrt-linux- \
            CC="mipsel-openwrt-linux-gcc -march=24kc -mtune=24kc -I$SYSROOT/usr/include -L$SYSROOT/usr/lib" \
            CXX="mipsel-openwrt-linux-g++ -march=24kc -mtune=24kc -I$SYSROOT/usr/include -L$SYSROOT/usr/lib" \
            LIBS='-Wl,--start-group -lloragw -ltinymt32 -lparson -lbase64 -lrt -lpthread -lm -lpaho-mqtt3c -lprotobuf -latomic -lgcc_eh -lgcc -Wl,--end-group'

      - name: Verify binary architecture and instruction set
        run: |
          file clusterduck/clusterduckd
          OBJDUMP="$(dirname "$(command -v mipsel-openwrt-linux-gcc)")/mipsel-openwrt-linux-objdump"
          COP1_COUNT="$("$OBJDUMP" -d clusterduck/clusterduckd | grep -cE '\b(lwc1|swc1|ldc1|sdc1|mfc1|mtc1|cfc1|ctc1)\b' || true)"
          DSP_COUNT="$("$OBJDUMP" -d clusterduck/clusterduckd | grep -cE '\b(lwx|lhx|lbux|lwxs|lhxs|ldx)\b' || true)"
          echo "COP1 (hardware FPU) instructions found: $COP1_COUNT"
          echo "DSP ASE instructions found: $DSP_COUNT"
          if [ "$COP1_COUNT" -ne 0 ] || [ "$DSP_COUNT" -ne 0 ]; then
            echo "::error::Binary contains hardware FPU and/or DSP instructions - will SIGILL on real MT7628AN hardware"
            exit 1
          fi

      - name: Package artifact
        run: |
          VERSION="${{ github.ref_name }}"
          ARTIFACT="clusterduckd-${VERSION}-linux-mipsel-24kec"
          mkdir -p dist
          cp clusterduck/clusterduckd "dist/${ARTIFACT}"
          echo "ARTIFACT_PATH=dist/${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clusterduckd-linux-mipsel-24kec
          path: ${{ env.ARTIFACT_PATH }}

  build-mips-24kc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cross-compiled inside a Debian (buster) container, targeting the
      # plain big-endian MIPS24Kc core (MIPS32r2), as used by Atheros
      # AR71xx/AR9xxx router SoCs. Debian dropped the big-endian "mips"
      # release architecture starting with bullseye (only mipsel/mips64el
      # remained), so this job pins to buster, the last release that still
      # has a binary-mips package pool. Buster is long EOL and
      # archive.debian.org's "buster" suite (the final accumulated 10.13
      # state) has a broken mips dependency graph - several -dev packages
      # (libusb-1.0-0-dev, libprotobuf-dev, libssl-dev) point at sibling
      # runtime library versions that were never actually rebuilt for mips
      # in later point releases. So apt is instead pointed at a
      # snapshot.debian.org timestamp shortly after the original buster
      # release, which is a self-consistent index+pool where every
      # architecture (including mips) was still fully in sync.
      #
      # The base image is pinned to the dated debian:buster-20190708 tag
      # (rather than the generic debian:buster tag, which resolves to the
      # final 10.13 state) so its pre-installed package versions predate
      # the chosen snapshot. Otherwise apt has to reconcile newer
      # already-installed base packages against the older snapshot index,
      # which it resolves by silently dropping unrelated packages from the
      # transaction (seen as collateral "Depends: X but it is not going to
      # be installed" errors for packages with no real version conflict).
      #
      # Debian never shipped libpaho-mqtt-dev for big-endian mips either:
      # paho.mqtt.c only entered the archive in 2020/2021 (bullseye), by
      # which point plain mips had already been dropped as a release
      # architecture. So it's cross-built from source here into the cross
      # sysroot (/usr/mips-linux-gnu) instead of being installed via apt.
      # Built with SSL enabled (matching the Debian package used by the
      # other two jobs, which provides both libpaho-mqtt3c and
      # libpaho-mqtt3cs) even though clusterduckd currently only links
      # the non-SSL libpaho-mqtt3c. clusterduckd links everything fully
      # static (-static in the Makefile), so PAHO_BUILD_STATIC=TRUE is
      # required - the default shared-only build produces a .so that the
      # static link can't use, which just shows up as a generic
      # "cannot find -lpaho-mqtt3c" from ld.
      #
      # The Makefile's LIBS places -lpthread before -lpaho-mqtt3c, which is
      # fine on the other two jobs' bookworm glibc (2.34+ merged libpthread
      # into libc, so -lpthread is just an empty compat stub), but buster's
      # glibc (2.28) still has pthread_* symbols in a real separate
      # libpthread.a, where static link order matters: a library is only
      # searched for symbols needed by things *after* it on the command
      # line. Paho's static lib (which needs pthread_*) comes after
      # -lpthread, so those symbols are never picked up. LIBS is overridden
      # here (rather than editing the shared Makefile) wrapped in
      # --start-group/--end-group so the linker re-scans archives until all
      # symbols resolve, regardless of order.
      #
      # The committed src/payloads/duck_payloads.pb.{h,cc} were generated by
      # protoc 3.21 (they #include <google/protobuf/port_def.inc>, which
      # doesn't exist before protobuf ~3.12), but buster only has protobuf
      # 3.6.1. Rather than cross-building protobuf 3.21+ from source (a much
      # heavier dependency than Paho, requiring Abseil on newer versions),
      # the .proto schema only uses plain proto3 features that 3.6.1 also
      # supports, so it's regenerated here with buster's own protoc
      # (matching the libprotobuf-dev:mips version) instead.
      - name: Build clusterduckd for MIPS24Kc (Debian cross-compile)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:buster-20190708 \
            bash -c "
              set -euo pipefail
              printf '%s\n' \
                'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20190801T025637Z/ buster main' \
                > /etc/apt/sources.list
              echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid-until
              dpkg --add-architecture mips
              apt-get update
              apt-get install -y --no-install-recommends \
                crossbuild-essential-mips \
                libusb-1.0-0-dev:mips \
                libprotobuf-dev:mips \
                libssl-dev:mips \
                protobuf-compiler \
                cmake git ca-certificates
              protoc -I clusterduck/src/payloads \
                --cpp_out=clusterduck/src/payloads \
                clusterduck/src/payloads/duck_payloads.proto
              git clone --depth 1 --branch v1.3.13 \
                https://github.com/eclipse/paho.mqtt.c.git /tmp/paho.mqtt.c
              cmake -S /tmp/paho.mqtt.c -B /tmp/paho-build \
                -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=mips \
                -DCMAKE_C_COMPILER=mips-linux-gnu-gcc \
                -DCMAKE_C_FLAGS='-EB -mips32r2 -march=24kc -mtune=24kc' \
                -DCMAKE_INSTALL_PREFIX=/usr/mips-linux-gnu \
                -DPAHO_WITH_SSL=TRUE \
                -DOPENSSL_ROOT_DIR=/usr/lib/mips-linux-gnu \
                -DOPENSSL_INCLUDE_DIR=/usr/include/mips-linux-gnu \
                -DOPENSSL_SSL_LIBRARY=/usr/lib/mips-linux-gnu/libssl.a \
                -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/mips-linux-gnu/libcrypto.a \
                -DPAHO_BUILD_STATIC=TRUE \
                -DPAHO_BUILD_SAMPLES=FALSE \
                -DPAHO_ENABLE_TESTING=FALSE \
                -DPAHO_ENABLE_CPACK=FALSE
              cmake --build /tmp/paho-build --target install -- -j\$(nproc)
              make clusterduck ARCH=mips CROSS_COMPILE=mips-linux-gnu- \
                CC='mips-linux-gnu-gcc -EB -mips32r2 -march=24kc -mtune=24kc' \
                CXX='mips-linux-gnu-g++ -EB -mips32r2 -march=24kc -mtune=24kc' \
                LIBS='-Wl,--start-group -lloragw -ltinymt32 -lparson -lbase64 -lrt -lpthread -lm -lpaho-mqtt3c -lprotobuf -latomic -Wl,--end-group'
            "

      - name: Fix file ownership
        run: sudo chown -R "$(id -u)":"$(id -g)" .

      - name: Verify binary architecture
        run: file clusterduck/clusterduckd

      - name: Package artifact
        run: |
          VERSION="${{ github.ref_name }}"
          ARTIFACT="clusterduckd-${VERSION}-linux-mips-24kc"
          mkdir -p dist
          cp clusterduck/clusterduckd "dist/${ARTIFACT}"
          echo "ARTIFACT_PATH=dist/${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clusterduckd-linux-mips-24kc
          path: ${{ env.ARTIFACT_PATH }}

  release:
    needs: [build-arm64, build-mips-24kec, build-mips-24kc]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
